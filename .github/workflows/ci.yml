name: CI

# Runs on every pull request and push to the app branch: typecheck, tests, builds and a check for
# known vulnerabilities in what ships to users. Needs no secrets.
on:
  pull_request:
  push:
    branches: [main, claude/travel-app-user-friendly-n8gmzm]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - run: npm run build:functions
      - name: Known vulnerabilities in shipped packages
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix functions ci
          npm --prefix functions audit --omit=dev --audit-level=high
